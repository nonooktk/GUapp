# GUapp ローカル MySQL（Docker がある PC 向け。設計仕様書 8.3・DS-DEC-25）
# 使い方:
#   1. リポジトリルートに .env を作り MYSQL_PASSWORD=<任意の値> を書く（.env はコミット禁止・gitignore 済み）
#   2. docker compose up -d
#   3. DATABASE_URL=mysql+asyncmy://guapp:<MYSQL_PASSWORD>@127.0.0.1:3306/guapp
# Docker が無い PC では scripts/mysql-local/ の PowerShell を使う（同じ設定値）。
# ※ 未検証: 作成者の PC に Docker が無いため、このファイルは実行確認をしていない（2026-09-18）。
services:
  mysql:
    image: mysql:8.4
    container_name: guapp-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --max-connections=200
    environment:
      # 値は .env の環境変数から注入する（compose ファイルに実値を書かない）
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD を .env に設定してください}
      MYSQL_DATABASE: guapp
      MYSQL_USER: guapp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD を .env に設定してください}
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - guapp-mysql-data:/var/lib/mysql
      # 初回起動時のみ実行される初期化 SQL（guapp_test の作成と権限付与）
      - ./scripts/mysql-local/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # CMD-SHELL 形式でコンテナ内の環境変数を展開する（$$ は compose のエスケープ）
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  guapp-mysql-data:
