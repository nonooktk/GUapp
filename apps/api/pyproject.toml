[project]
name = "guapp-api"
version = "0.1.0"
description = "GU EC サイト P1 バックエンド（FastAPI）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.40",
    "sqlalchemy[asyncio]>=2.0.54",
    "asyncmy>=0.2.14",
    # MySQL 8.x 既定の caching_sha2_password 認証に asyncmy が必要とする
    "cryptography>=45",
    "alembic>=1.20",
    "pydantic-settings>=2.10",
    "pydantic[email]>=2.12",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "aiosqlite>=0.21",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 環境変数は tests/conftest.py で明示的に与える（.env は読まない）
