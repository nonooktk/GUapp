# Alembic config (GUapp API / P1)
# NOTE: this file is parsed with the locale encoding (cp932 on Windows), so keep it ASCII.
#
# No connection URL here. `alembic/env.py` reads
# `app.core.config.get_settings().DATABASE_URL` from the environment (regulations sec.3).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Revision file name: <rev>_<slug>.py (the first one is renamed by hand to 0001_p1_initial.py)
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

# logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
