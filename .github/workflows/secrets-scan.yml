# 秘密情報のスキャン（設計仕様書 7.2・DS-DEC-30）。
# ローカルの pre-commit（detect-secrets）と二重化し、履歴全体を gitleaks で走査する。
# 個人リポジトリでは gitleaks-action は無料（GITLEAKS_LICENSE 不要）。
name: secrets-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 履歴全体を走査する
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
