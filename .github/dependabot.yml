# Dependabot: 依存の更新・脆弱性修正を週次で自動 PR 化する（github-repo-security 基線）。
# minor/patch はグループ化して PR 数を抑え、major は個別 PR で精査する。
version: 2
updates:
  # apps/web（pnpm）
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # apps/api（uv）
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      uv-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions 自体（SHA 固定した action の更新 PR）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
